services:
  - type: web
    name: tg-file-stream
    runtime: docker
    plan: free
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BIN_CHANNEL
        sync: false
      - key: OWNER_ID
        sync: false
      - key: FQDN
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: PORT
        value: 10000
    healthCheckPath: /
